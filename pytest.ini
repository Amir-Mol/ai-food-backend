[pytest]
# Pytest configuration for Phase 5 testing

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Markers for organizing tests
markers =
    scenario_a: Post-onboarding auto-generation test
    scenario_b: 5-feedback summarization test
    scenario_c: Timer gate blocking test
    scenario_d: Fresh Stage 1 discovery test
    scenario_e: Concurrent feedback handling test
    integration: Integration tests (multiple components)
    unit: Unit tests (single component)

# Timeout for tests (in seconds)
timeout = 300

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
